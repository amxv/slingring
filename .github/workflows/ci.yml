name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "dist-workspace.toml"
      - "Justfile"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "extension/**"
      - "apps/menubar/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "dist-workspace.toml"
      - "Justfile"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "extension/**"
      - "apps/menubar/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test isolated installers
        run: python3 scripts/test_installers.py

      - name: Build the native menu bar companion
        run: |
          bash apps/menubar/test.sh
          cargo build --locked
          mkdir -p tmp/ci
          cp target/debug/slingring tmp/ci/slingring
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          bash apps/menubar/build.sh "$PWD/tmp/ci/Slingring.app" arm64 "$version"
          tmp/ci/Slingring.app/Contents/MacOS/slingring-menubar --check

  web-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Extension checks and behavior tests
        working-directory: extension
        run: bun install --frozen-lockfile && bun run check && bun run test
      - name: Relay type checking and transport tests
        working-directory: relay
        run: bun install --frozen-lockfile && bun run check && bun run test && bun run dry-run
