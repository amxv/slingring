name: Publish Swift menu bar bundles

# cargo-dist includes this only when direct --macos-menubar is selected.
# post-announce means the GitHub Release already exists before we upload.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-menu-bar:
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triple: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and native target
        shell: bash
        env:
          TARGET: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add "$TARGET" --toolchain 1.99.1
      - name: Build, ad-hoc sign, and archive CLI + Swift app
        shell: bash
        env:
          TARGET: ${{ matrix.triple }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo +1.99.1 build --locked --release --target "$TARGET"
          mkdir -p stage out
          cp "target/$TARGET/release/slingring" "stage/slingring"
          chmod 755 "stage/slingring"
          codesign --force --sign - --identifier com.amxv.slingring.cli "stage/slingring"
          codesign --verify --strict "stage/slingring"
          bash apps/menubar/build.sh "$PWD/stage/Slingring.app" arm64 "$version"
          codesign --verify --deep --strict "stage/Slingring.app"
          "stage/Slingring.app/Contents/MacOS/slingring-menubar" --check
          cp LICENSE stage/LICENSE
          archive="slingring_darwin_${ARCH}.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "out/$archive" -C stage "slingring" "Slingring.app" LICENSE
          shasum -a 256 "out/$archive" | awk '{print $1}' > "out/$archive.sha256"
      - name: Attach verified menu bar bundles to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
