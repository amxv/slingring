[package]
name = "slingring"
version = "0.6.0"
edition = "2024"
rust-version = "1.99.1"
description = "Launch ChatGPT tasks from local and remote agents, then get out of the way."
license = "Apache-2.0"
repository = "https://github.com/amxv/slingring"
homepage = "https://slingring.ashray.xyz"
readme = "README.md"
publish = false
include = ["/src/**", "/scripts/install-browser.sh", "/extension/*.js", "/extension/*.html", "/extension/manifest.json", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]
keywords = ["cli", "mcp", "chatgpt", "automation"]
categories = ["command-line-utilities"]

[package.metadata.dist]
dist = true

[[bin]]
name = "slingring"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

tokio = { version = "1", features = ["process", "io-util", "io-std", "net", "time", "rt", "macros", "signal", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
fs2 = "0.4"
url = "2"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2.0"
predicates = "3.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Fast local development defaults; use `--profile debugging` when full debug
# information is actually needed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dist]
inherits = "release"
